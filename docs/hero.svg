<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Apple SD Gothic Neo','Noto Sans KR',Segoe UI,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#e3ebf2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 지도 배경 -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- 옅은 도로 -->
  <g stroke="#cdd8e3" stroke-width="3" fill="none" opacity="0.8">
    <path d="M0,140 L1200,90"/>
    <path d="M0,330 L1200,300"/>
    <path d="M0,520 L1200,560"/>
    <path d="M250,0 L360,630"/>
    <path d="M640,0 L760,630"/>
    <path d="M980,0 L1040,630"/>
  </g>
  <g stroke="#e6a23c" stroke-width="4" fill="none" opacity="0.5">
    <path d="M120,560 C400,420 560,360 780,330 C980,300 1080,210 1200,170"/>
  </g>

  <!-- 등시간선 밴드 (120 → 90 → 60분) -->
  <g stroke-width="2.5" fill-opacity="0.22">
    <path d="M605,170 L715,150 L805,170 L905,150 L995,250 L965,330 L1010,440 L900,500 L810,480 L700,510 L600,455 L560,320 Z"
          fill="#ef4444" stroke="#b91c1c"/>
    <path d="M650,210 L730,195 L800,210 L880,195 L945,265 L925,335 L960,415 L875,455 L805,440 L720,465 L645,420 L610,330 Z"
          fill="#f59e0b" stroke="#b45309"/>
    <path d="M690,250 L740,235 L800,250 L860,240 L905,290 L890,345 L915,400 L850,415 L800,400 L740,420 L695,385 L665,335 Z"
          fill="#22c55e" stroke="#15803d"/>
  </g>

  <!-- 중심 마커 -->
  <g transform="translate(780,330)">
    <ellipse cx="0" cy="6" rx="13" ry="5" fill="#0f172a" opacity="0.18"/>
    <path d="M0,-34 C-15,-34 -22,-22 -22,-12 C-22,2 0,6 0,6 C0,6 22,2 22,-12 C22,-22 15,-34 0,-34 Z" fill="#2563eb"/>
    <circle cx="0" cy="-14" r="7" fill="#fff"/>
  </g>

  <!-- 좌측 패널 목업 -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="300" height="360" rx="16" fill="#ffffff"/>
  </g>
  <g transform="translate(84,178)">
    <circle cx="10" cy="10" r="10" fill="#2563eb"/>
    <text x="6" y="15" font-size="12" font-weight="800" fill="#fff">1</text>
    <text x="30" y="15" font-size="14" font-weight="700" fill="#334155">출발지</text>
    <rect x="0" y="30" width="252" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="12" y="52" font-size="12.5" fill="#64748b">서울특별시청</text>

    <circle cx="10" cy="100" r="10" fill="#2563eb"/>
    <text x="6" y="105" font-size="12" font-weight="800" fill="#fff">3</text>
    <text x="30" y="105" font-size="14" font-weight="700" fill="#334155">표시 시간</text>
    <text x="200" y="105" font-size="14" font-weight="800" fill="#2563eb">60분</text>
    <!-- 슬라이더 -->
    <rect x="0" y="122" width="252" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="0" y="122" width="126" height="6" rx="3" fill="#2563eb"/>
    <circle cx="126" cy="125" r="10" fill="#2563eb" stroke="#fff" stroke-width="2.5"/>
    <text x="0" y="150" font-size="10" fill="#94a3b8">0</text>
    <text x="232" y="150" font-size="10" fill="#94a3b8">120분</text>

    <!-- 범례 -->
    <rect x="0" y="178" width="252" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="14" y="200" font-size="11.5" font-weight="700" fill="#64748b">📡 로컬 대중교통 (버스+지하철)</text>
    <rect x="14" y="214" width="26" height="11" rx="3" fill="#22c55e" opacity="0.8"/>
    <text x="50" y="224" font-size="12" fill="#334155">60분 이내 도달 영역</text>
    <text x="14" y="243" font-size="11" fill="#16a34a">완료 · 외부 경로 API 0회</text>
  </g>

  <!-- 타이틀 -->
  <g transform="translate(60,70)">
    <text x="0" y="0" font-size="34" font-weight="800" fill="#0f172a">대중교통 이동 범위 지도</text>
    <text x="2" y="30" font-size="16" font-weight="600" fill="#475569">버스·지하철 등시간선 · 외부 경로 API 없이 브라우저에서 직접 계산</text>
  </g>
</svg>
